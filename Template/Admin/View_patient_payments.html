{% extends 'Admin/AdminHome.html'%}
{% block contents %}
<div class="max-w-lg mx-auto">
    <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-8">
        <h2 class="text-2xl font-bold display mb-2">Patient Payment</h2>
        <p class="text-sm text-slate-500 mb-6">Set the due amount for this patient.</p>

        {% if messages %}
            <div class="space-y-2 mb-4">
                {% for mes in messages %}
                <div class="rounded-lg px-4 py-3 text-sm bg-emerald-50 text-emerald-700 border border-emerald-100">
                    <i class="fas fa-circle-check mr-2"></i>{{ mes }}
                </div>
                {% endfor %}
            </div>
        {% endif %}

        <form action="" method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="text-sm font-semibold text-slate-700">Patient Name</label>
                <input type="text" name="name" value="{{ Patient_data.name }}" readonly>
            </div>
            <div>
                <label class="text-sm font-semibold text-slate-700">Due Amount</label>
                <input type="text" name="amount" placeholder="Enter amount">
            </div>
            <button type="submit" class="w-full py-3 rounded-xl bg-emerald-600 text-white font-semibold shadow-lg hover:shadow-xl transition">
                Save Payment
            </button>
        </form>
    </div>
</div>

<style>
    input {
        width: 100%;
        margin-top: 6px;
        padding: 10px 12px;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        background: #f8fafc;
        outline: none;
        transition: all 0.2s ease;
    }
    input:focus {
        border-color: #10b981;
        background: #ffffff;
        box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
    }
</style>
{% endblock %}
