{% extends 'Admin/AdminHome.html' %}
{% block contents %}
<div class="max-w-2xl mx-auto">
    <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-8">
        <h2 class="text-2xl font-bold display mb-2">Update Doctor Details</h2>
        <p class="text-sm text-slate-500 mb-6">Edit profile information for the selected doctor.</p>
        <form method="post" enctype="multipart/form-data" class="space-y-4">
            {% csrf_token %}
            <div class="grid md:grid-cols-2 gap-4">
                <div>
                    <label class="text-sm font-semibold text-slate-700">Name</label>
                    {{ form.name }}
                </div>
                <div>
                    <label class="text-sm font-semibold text-slate-700">Email</label>
                    {{ form.email }}
                </div>
                <div>
                    <label class="text-sm font-semibold text-slate-700">Phone</label>
                    {{ form.phone }}
                </div>
                <div>
                    <label class="text-sm font-semibold text-slate-700">Specialization</label>
                    {{ form.specialization }}
                </div>
                <div>
                    <label class="text-sm font-semibold text-slate-700">Qualification</label>
                    {{ form.qualification }}
                </div>
                <div>
                    <label class="text-sm font-semibold text-slate-700">Experience</label>
                    {{ form.experience }}
                </div>
            </div>
            <button type="submit" class="w-full py-3 rounded-xl bg-emerald-600 text-white font-semibold shadow-lg hover:shadow-xl transition">
                Save Changes
            </button>
        </form>
    </div>
</div>

<style>
    input, select, textarea {
        width: 100%;
        margin-top: 6px;
        padding: 10px 12px;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        background: #f8fafc;
        outline: none;
        transition: all 0.2s ease;
    }
    input:focus, select:focus, textarea:focus {
        border-color: #10b981;
        background: #ffffff;
        box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
    }
</style>
{% endblock %}
