{% extends 'Doctor/Doctor_Home.html' %}
{% block contents %}
<div class="max-w-2xl mx-auto">
    <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-8">
        <h2 class="text-2xl font-bold display mb-2">Medication Form</h2>
        <p class="text-sm text-slate-500 mb-6">Provide prescription notes and admission status.</p>
        <form action="" method="post" enctype="multipart/form-data" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="text-sm font-semibold text-slate-700">Patient Name</label>
                <input type="text" name="name" value="{{ form.name }}" readonly>
            </div>
            <div>
                <label class="text-sm font-semibold text-slate-700">Doctor Name</label>
                <input type="text" name="doctor_name" value="{{ form.doctor_name }}" readonly>
            </div>
            <div>
                <label class="text-sm font-semibold text-slate-700">Prescription</label>
                <textarea name="prescription" rows="5" placeholder="Enter medication details"></textarea>
            </div>
            <div>
                <label class="text-sm font-semibold text-slate-700">Admission Status</label>
                <select name="admit">
                    <option value="">Choose Option</option>
                    <option value="No Need">No Need</option>
                    <option value="onHold">On Hold</option>
                    <option value="Admit">Admit</option>
                </select>
            </div>
            <input type="hidden" name="medication" value="None">
            <button type="submit" class="w-full py-3 rounded-xl bg-amber-500 text-white font-semibold shadow-lg hover:shadow-xl transition">
                Submit Medication
            </button>
        </form>
    </div>
</div>

<style>
    input, select, textarea {
        width: 100%;
        margin-top: 6px;
        padding: 10px 12px;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        background: #f8fafc;
        outline: none;
        transition: all 0.2s ease;
    }
    input:focus, select:focus, textarea:focus {
        border-color: #f59e0b;
        background: #ffffff;
        box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.15);
    }
    input[readonly] { background: #f1f5f9; }
</style>
{% endblock %}
